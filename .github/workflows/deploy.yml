name: Deploy backend to Hostinger Docker Manager

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: animal-server
          docker-compose-path: docker-compose.yml
          environment-variables: |
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD || 'animal_db_pass' }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD || 'animal_root_pass' }}
