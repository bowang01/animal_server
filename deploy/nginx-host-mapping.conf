# Add this to the existing Hostinger nginx (80/443 domain mapping).
# If you use a GUI mapper (Nginx Proxy Manager etc.), skip this file and
# just forward animal.bowang.tech -> 127.0.0.1:18080.

server {
    listen 80;
    server_name animal.bowang.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name animal.bowang.tech;

    # Replace with the certificate paths your VPS already uses.
    # ssl_certificate     /etc/letsencrypt/live/animal.bowang.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/animal.bowang.tech/privkey.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
